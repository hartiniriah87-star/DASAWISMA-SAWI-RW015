      {key:'status',label:'Status',type:'select',options:['Ibu','Balita','Bayi']},
      {key:'jenisKelamin',label:'Jenis Kelamin',type:'select',options:['Laki-laki','Perempuan']},
      {key:'tanggalMeninggal',label:'Tanggal Meninggal',type:'date'},
      {key:'sebab',label:'Sebab Meninggal'}, {key:'keterangan',label:'Keterangan',type:'textarea',full:true}
    ]
  }
};

const TABLE_DEFS = {
  WARGA:[['noRegister','No. Register'],['namaKRT','Kepala Rumah Tangga'],['nama','Nama Warga'],['nik','NIK'],['rtDusun','RT / Dusun'],['dasawisma','Dasawisma']],
  KELUARGA:[['noKK','Nomor KK'],['namaKRT','Kepala Keluarga'],['rtDusun','RT / Dusun'],['kriteriaRumah','Kriteria Rumah'],['sumberAir','Sumber Air'],['makananPokok','Makanan Pokok']],
  ANGGOTA:[['namaKRT','Kepala Keluarga'],['namaAnggota','Nama Anggota'],['jenisKelamin','Jenis Kelamin'],['tanggalLahir','Tanggal Lahir'],['statusKeluarga','Status Keluarga'],['pekerjaan','Pekerjaan']],
  KEHAMILAN:[['namaIbu','Nama Ibu'],['namaSuami','Nama Suami'],['status','Status'],['namaBayi','Nama Bayi'],['tanggalLahir','Tanggal Lahir Bayi']],
  KEMATIAN:[['nama','Nama'],['status','Status'],['jenisKelamin','Jenis Kelamin'],['tanggalMeninggal','Tanggal Meninggal'],['sebab','Sebab Meninggal']]
};

function boot() {
  google.script.run.withSuccessHandler(function (res) {
    appData = res || appData;
    renderPage();
  }).withFailureHandler(function (err) {
    document.getElementById('content').innerHTML = '<div class="panel"><h4>Gagal memuat aplikasi</h4><p>' + esc(err.message || err) + '</p><p>Pastikan akun pemilik Apps Script memiliki akses Editor pada spreadsheet tujuan dan fungsi setupDatabase() sudah dijalankan.</p></div>';
  }).getAppData();
}

function navigate(page) {
  currentPage = page; editing = null;
  document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.page === page); });
  document.getElementById('topTitle').textContent = PAGE_INFO[page][0];
  document.getElementById('topSubtitle').textContent = PAGE_INFO[page][1];
  document.getElementById('sidebar').classList.remove('open');
  renderPage();
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

function renderPage() {
  if (currentPage === 'dashboard') return renderDashboard();
  const kind = ({warga:'WARGA',keluarga:'KELUARGA',anggota:'ANGGOTA',kehamilan:'KEHAMILAN',kematian:'KEMATIAN'})[currentPage];
  renderCrudPage(kind);
}

function renderCrudPage(kind) {
  const def = FORM_DEFS[kind];
  const records = appData[kind.toLowerCase()] || [];
  const activeRecord = editing && editing.kind === kind ? editing.record : null;
  const fieldsHtml = def.fields.map(function (f) { return renderField(f, activeRecord || {}); }).join('');
  const table = renderTable(kind, records);
  document.getElementById('content').innerHTML = `
    <div class="page-heading"><div><h3>${def.title}</h3><p>${def.description}</p></div><span class="status-chip">${records.length} data tersimpan</span></div>
    ${kind === 'ANGGOTA' && appData.keluarga.length === 0 ? '<div class="info-strip">Belum ada data keluarga. Tambahkan data pada menu <b>Data Keluarga</b> terlebih dahulu agar anggota dapat dihubungkan ke nomor KK.</div>' : ''}
    <div class="panel"><h4>${activeRecord ? '✏️ Perbarui Data' : '＋ Tambah Data'}</h4>
      <form id="dataForm" onsubmit="submitForm(event,'${kind}')">
        <input type="hidden" data-key="id" value="${esc(activeRecord && activeRecord.id || '')}">
        <div class="form-grid">${fieldsHtml}</div>
        <div class="form-actions">${activeRecord ? '<button type="button" class="btn btn-light" onclick="cancelEdit()">Batal</button>' : ''}<button class="btn btn-primary" id="saveBtn" type="submit">💾 ${activeRecord ? 'Simpan Perubahan' : 'Simpan Data'}</button></div>
      </form>
      <p class="form-note">Data disimpan langsung ke Spreadsheet SAWI RW 015 yang terhubung. Pastikan Anda sudah diberi akses oleh pemilik spreadsheet.</p>
    </div>
    <div class="table-panel"><div class="table-toolbar"><strong>Daftar ${def.title.replace('Formulir ','').replace('Data ','')}</strong><input id="tableSearch" placeholder="Cari data..." oninput="filterTable()"></div><div class="table-scroll">${table}</div></div>`;
  if (kind === 'ANGGOTA') {
    const select = document.querySelector('[data-key="idKeluarga"]');
    if (select) select.addEventListener('change', syncFamilyHead);
  }
}

function renderField(field, record) {
  if (field.type === 'section') return `<div class="section-break">${esc(field.label)}</div>`;
  const value = record[field.key] !== undefined && record[field.key] !== null ? record[field.key] : (field.value || '');
  const full = field.full ? ' full' : (field.span2 ? ' span2' : '');
  const required = field.required ? ' required' : '';
  const label = `${esc(field.label)}${field.required ? ' <span class="req">*</span>' : ''}`;
  let control = '';
  if (field.type === 'checks') {
    const selected = Array.isArray(value) ? value : [];
    control = `<div class="check-grid">${field.options.map(function(opt){return `<label class="check-option"><input type="checkbox" data-array="${field.key}" value="${esc(opt)}" ${selected.indexOf(opt)>=0?'checked':''}> ${esc(opt)}</label>`;}).join('')}</div>`;
  } else if (field.type === 'select') {
    control = `<select data-key="${field.key}"${required}><option value="">Pilih...</option>${field.options.map(function(opt){return `<option value="${esc(opt)}" ${String(value)===opt?'selected':''}>${esc(opt)}</option>`;}).join('')}</select>`;
  } else if (field.type === 'family') {
    const opts = appData.keluarga.map(function(k){return `<option value="${esc(k.id)}" ${String(value)===String(k.id)?'selected':''}>${esc(k.noKK || '(Tanpa No. KK)')} — ${esc(k.namaKRT || '')}</option>`;}).join('');
    control = `<select data-key="idKeluarga"${required}><option value="">Pilih keluarga...</option>${opts}</select>`;
  } else if (field.type === 'textarea') {
    control = `<textarea data-key="${field.key}" placeholder="${esc(field.placeholder||'Isi '+field.label.toLowerCase())}">${esc(value)}</textarea>`;
  } else {
    const type = field.type || 'text';
    control = `<input data-key="${field.key}" type="${type}" value="${esc(value)}" placeholder="${esc(field.placeholder||'Isi '+field.label.toLowerCase())}"${required} ${field.key==='namaKRT' && currentPage==='anggota' ? '' : ''}>`;
  }
  return `<div class="field${full}"><label>${label}</label>${control}</div>`;
}

function syncFamilyHead() {
  const form = document.getElementById('dataForm');
  if (!form) return;
  const id = form.querySelector('[data-key="idKeluarga"]').value;
  const family = appData.keluarga.find(function(k){return k.id===id;});
  const name = form.querySelector('[data-key="namaKRT"]');
  if (name && family) name.value = family.namaKRT || '';
}

function collectForm(form) {
  const data = {};
  form.querySelectorAll('[data-key]').forEach(function(el){data[el.dataset.key] = el.value;});
  const arrays = {};
  form.querySelectorAll('[data-array]').forEach(function(el){
    const key = el.dataset.array;
    if (!arrays[key]) arrays[key] = [];
    if (el.checked) arrays[key].push(el.value);
  });
  Object.keys(arrays).forEach(function(k){data[k] = arrays[k];});
  return data;
}

function submitForm(event, kind) {
  event.preventDefault();
  const form = event.target;
  if (!form.reportValidity()) return;
  const data = collectForm(form);
  const button = document.getElementById('saveBtn');
  button.disabled = true; button.textContent = 'Menyimpan...';
  google.script.run.withSuccessHandler(function(res){
    showToast(res.message || 'Data tersimpan.'); editing = null;
    refreshData();
  }).withFailureHandler(function(err){
    button.disabled = false; button.textContent = '💾 Simpan Data';
    showToast(err.message || String(err), true);
  }).saveRecord(kind, data);
}

function editRecord(kind,id) {
  const list = appData[kind.toLowerCase()] || [];
  const record = list.find(function(r){return r.id===id;});
  if (!record) return showToast('Data tidak ditemukan.', true);
  editing = {kind:kind,record:record};
  currentPage = kind.toLowerCase();
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.page===currentPage);});
  document.getElementById('topTitle').textContent = PAGE_INFO[currentPage][0];
  document.getElementById('topSubtitle').textContent = PAGE_INFO[currentPage][1];
  renderCrudPage(kind);
  window.scrollTo({top:0,behavior:'smooth'});
}
function cancelEdit(){editing=null;renderPage();}
function removeRecord(kind,id){
  if(!confirm('Hapus data ini? Tindakan ini tidak dapat dibatalkan.')) return;
  google.script.run.withSuccessHandler(function(res){showToast(res.message||'Data dihapus.');refreshData();})
    .withFailureHandler(function(err){showToast(err.message||String(err),true);}).deleteRecord(kind,id);
}

function renderTable(kind, records) {
  const columns = TABLE_DEFS[kind];
  if (!records.length) return '<table><thead><tr>'+columns.map(function(c){return '<th>'+c[1]+'</th>';}).join('')+'<th>Aksi</th></tr></thead><tbody><tr><td class="empty-state" colspan="'+(columns.length+1)+'">Belum ada data. Silakan isi formulir di atas.</td></tr></tbody></table>';
  const rows = records.map(function(r,index){
    return `<tr data-search="${esc(columns.map(function(c){return displayValue(r[c[0]]);}).join(' '))}">${columns.map(function(c){return `<td>${esc(displayValue(r[c[0]]) || '—')}</td>`;}).join('')}<td><div class="actions"><button class="btn btn-small btn-light" onclick="editRecord('${kind}','${esc(r.id)}')">✏️ Edit</button><button class="btn btn-small btn-danger" onclick="removeRecord('${kind}','${esc(r.id)}')">Hapus</button></div></td></tr>`;
  }).join('');
  return `<table><thead><tr>${columns.map(function(c){return `<th>${c[1]}</th>`;}).join('')}<th>Aksi</th></tr></thead><tbody id="recordsBody">${rows}</tbody></table>`;
}
function filterTable(){
  const input=document.getElementById('tableSearch'); if(!input)return;
  const q=input.value.toLowerCase();
  document.querySelectorAll('#recordsBody tr').forEach(function(row){row.style.display=row.dataset.search.toLowerCase().indexOf(q)>=0?'':'none';});
}
function displayValue(value){return Array.isArray(value)?value.join(', '):(value===null||value===undefined?'':String(value));}

function metricCard(item){
  return `<div class="metric" style="--c:${item[3]}"><div class="metric-head"><span class="metric-icon">${item[2]}</span><span>${esc(item[0])}</span></div><div class="metric-value">${Number(item[1]||0).toLocaleString('id-ID')}</div>${item[4]?`<div class="metric-note">${esc(item[4])}</div>`:''}</div>`;
}

function dashboardRows(s){
  const rows=[];
  const push=(group,label,value,color)=>rows.push(`<tr><td>${esc(group)}</td><td><span class="color-dot" style="background:${color}"></span>${esc(label)}</td><td><b>${Number(value||0).toLocaleString('id-ID')}</b></td></tr>`);
  const a=s.summary||{},g=s.gender||{},d=s.demografi||{},r=s.rumah||{};
  push('Pendataan','Kepala Rumah Tangga',a.kepalaRumahTangga,'#2563eb');
  push('Pendataan','Kepala Keluarga / KK',a.kepalaKeluarga,'#8b5cf6');
  push('Pendataan','Total Anggota Keluarga',a.totalAnggota,'#0891b2');
  push('Pendataan','Warga TP PKK',a.wargaTPPKK,'#db5b9b');
  push('Jenis Kelamin','Laki-laki',g.lakiLaki,'#2384d8');
  push('Jenis Kelamin','Perempuan',g.perempuan,'#e45b9b');
  [['Balita Laki-laki',d.balitaLaki,'#f59e0b'],['Balita Perempuan',d.balitaPerempuan,'#ec4899'],['PUS',d.pus,'#8b5cf6'],['WUS',d.wus,'#d946a6'],['Ibu Hamil',d.ibuHamil,'#ef7c43'],['Ibu Menyusui',d.ibuMenyusui,'#0d9488'],['Lansia',d.lansia,'#64748b'],['3 Buta',d.tigaButa,'#ca8a04'],['Berkebutuhan Khusus',d.berkebutuhanKhusus,'#7c6bd6']].forEach(x=>push('Demografi & Kesehatan',x[0],x[1],x[2]));
  [['Rumah Sehat Layak Huni',r.sehat,'#16a36a'],['Rumah Tidak Sehat',r.tidakSehat,'#e05252'],['Tempat Pembuangan Sampah',r.tempatSampah,'#64748b'],['Memiliki SPAL',r.spal,'#2696b8'],['Jamban Keluarga',r.jamban,'#8b5cf6'],['Stiker P4K',r.stikerP4K,'#e28a31']].forEach(x=>push('Rumah & Sanitasi',x[0],x[1],x[2]));

  (s.activities||[]).forEach((x,i)=>push('Kegiatan Warga',x.label,x.value,['#159b82','#65a34a','#c07a38','#3b82c4'][i]));
  return rows.join('');
}

function drawCharts(s){
  chartInstances.forEach(function(c){try{c.destroy();}catch(e){}}); chartInstances=[];
  if(typeof Chart==='undefined') return;
  const dem=s.demografi||{}, gender=s.gender||{}, rumah=s.rumah||{};
  function chart(id,type,labels,values,colors,opts){
    const el=document.getElementById(id); if(!el)return;
    chartInstances.push(new Chart(el,{type:type,data:{labels:labels,datasets:[{data:values,backgroundColor:colors,borderColor:'#ffffff',borderWidth:2,borderRadius:type==='bar'?5:0,hoverOffset:5}]},options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{position:type==='bar'?'bottom':'bottom',labels:{boxWidth:10,font:{size:10}}}},scales:type==='bar'?{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#edf1f6'}},x:{grid:{display:false}}}:{}},opts||{})}));
  }
  chart('genderChart','doughnut',['Laki-laki','Perempuan'],[gender.lakiLaki||0,gender.perempuan||0],['#2384d8','#e45b9b']);
  chart('demographyChart','bar',['Balita L','Balita P','PUS','WUS','Ibu Hamil','Ibu Menyusui','Lansia','3 Buta','Kebutuhan Khusus'],[dem.balitaLaki||0,dem.balitaPerempuan||0,dem.pus||0,dem.wus||0,dem.ibuHamil||0,dem.ibuMenyusui||0,dem.lansia||0,dem.tigaButa||0,dem.berkebutuhanKhusus||0],['#f59e0b','#ec4899','#8b5cf6','#d946a6','#ef7c43','#0d9488','#64748b','#ca8a04','#7c6bd6']);
  chart('houseChart','bar',['Rumah Sehat','Rumah Tidak Sehat','Tempat Sampah','SPAL','Jamban','Stiker P4K'],[rumah.sehat||0,rumah.tidakSehat||0,rumah.tempatSampah||0,rumah.spal||0,rumah.jamban||0,rumah.stikerP4K||0],['#16a36a','#e05252','#64748b','#2696b8','#8b5cf6','#e28a31']);
  const water=s.water||[]; chart('waterChart','doughnut',water.map(x=>x.label),water.map(x=>x.value),['#2586d8','#0e9f9a','#3c9c72','#647db6','#6b9ac2','#8b5cf6','#d97706']);
  const food=s.food||[]; chart('foodChart','doughnut',food.map(x=>x.label),food.map(x=>x.value),['#d49a25','#68a64b']);
  const activity=s.activities||[]; chart('activityChart','bar',activity.map(x=>x.label),activity.map(x=>x.value),['#159b82','#65a34a','#c07a38','#3b82c4'],{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0},grid:{color:'#edf1f6'}},y:{grid:{display:false}}}});
}

function refreshData(){
  const content=document.getElementById('content');
  if(content) content.style.opacity='.6';
  google.script.run.withSuccessHandler(function(res){appData=res||appData;renderPage();if(content)content.style.opacity='1';})
    .withFailureHandler(function(err){if(content)content.style.opacity='1';showToast(err.message||String(err),true);}).getAppData();
}
function showToast(message,isError){
  const el=document.getElementById('toast');el.textContent=message;el.classList.toggle('error',!!isError);el.classList.add('show');
  clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(function(){el.classList.remove('show');},3200);
}
function esc(value){
  return String(value===null||value===undefined?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

window.addEventListener('load',boot);
</script>
